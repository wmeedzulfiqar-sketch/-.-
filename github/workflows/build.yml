name: Build Flutter APK from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          # غير اسم الملف إذا كان اسمه غير Aura_app.zip
          unzip Aura_app.zip -d ./app_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd app_source
          # بعض الملفات المضغوطة يكون داخلها مجلد ثاني، هذا السطر يتحقق ويدخل له
          if [ -d "Aura_app" ]; then cd Aura_app; fi
          flutter pub get

      - name: Build APK
        run: |
          cd app_source
          if [ -d "Aura_app" ]; then cd Aura_app; fi
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-App-APK
          path: app_source/**/build/app/outputs/flutter-apk/app-release.apk
